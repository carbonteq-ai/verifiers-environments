[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automationbench-v1"
version = "0.4.0"
description = "AutomationBench environment for the Verifiers v1 runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "CarbonTeq" }]
dependencies = [
    "anthropic>=0.83.0",
    "datasets>=4.6.1,<5",
    "httpx>=0.27",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.1,<2",
    "rich>=13,<16",
    "verifiers @ git+https://github.com/carbonteq-ai/verifiers.git@3cd9045ab23c11c6006202066244063aa012dc47",
]

[project.urls]
Repository = "https://github.com/carbonteq-ai/verifiers-environments"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.14,<1",
]

# PyPI first; the internal index only supplies carbonteq-renderers, which the
# pinned Verifiers fork requires.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "carbonteq-dev"
url = "https://pypi.lan/carbonteq/dev/+simple/"

[tool.hatch.build.targets.wheel]
packages = ["src/automationbench_v1", "src/automationbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# With `-n N`, keep each file on one worker: several files share mutable
# module-scoped fixtures (recorded episodes) and rely on in-file order.
addopts = ["--dist=loadfile"]
markers = [
    "network: explicitly enabled live service integration requiring credentials",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/automationbench"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
extend-exclude = ["src/automationbench"]
target-version = "py312"

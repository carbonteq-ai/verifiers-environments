[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automationbench-v1"
version = "0.3.0"
description = "AutomationBench environment for the Verifiers v1 runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "CarbonTeq" }]
dependencies = [
    "anthropic>=0.83.0",
    "datasets>=4.6.1,<5",
    "httpx>=0.27",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.1,<2",
    "rich>=13,<15",
    "verifiers @ git+https://github.com/carbonteq-ai/verifiers.git@90055c11896954fac429bb9120245caa6dc1dd59",
]

[project.urls]
Repository = "https://github.com/carbonteq-ai/verifiers-environments"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automationbench_v1", "src/automationbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/automationbench"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
extend-exclude = ["src/automationbench"]
target-version = "py312"

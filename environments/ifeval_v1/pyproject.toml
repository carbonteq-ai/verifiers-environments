[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifeval-v1"
version = "0.1.0"
description = "IFEval environment for the Verifiers v1 runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "CarbonTeq" }]
dependencies = [
    "datasets>=4,<5",
    "langdetect>=1.0.9,<2",
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@284a868d6a9022109b749710672a0460e8a996d4",
]

[project.urls]
Repository = "https://github.com/carbonteq-ai/verifiers-environments"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ifeval_v1"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires downloading the pinned Hugging Face dataset"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py312"

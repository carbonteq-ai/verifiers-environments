[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-python-v1"
version = "0.1.0"
description = "Math Python environment for the Verifiers v1 runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "CarbonTeq" }]
dependencies = [
    "verifiers @ git+https://github.com/carbonteq-ai/verifiers.git@0cee0a075ddf1883498be0fde34155655cb19146",
    "datasets>=3.5,<5",
]

[project.urls]
Repository = "https://github.com/carbonteq-ai/verifiers-environments"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/math_python_v1"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py312"

# Verifiers depends on CarbonTeq's carbonteq-renderers fork, published to the
# internal development index. These indexes only serve this package's own lock:
# there is deliberately no source pin, so consumers supply the wheel from their
# own index or wheelhouse.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "carbonteq-dev"
url = "https://pypi.lan/carbonteq/dev/+simple/"
